<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>バーコード照合</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color-scheme:light}body{margin:0;background:#f3f5f8;color:#17202b;transition:background .16s}body.ok{background:#42c778}body.ng{background:#f36c6c}main{max-width:560px;margin:auto;padding:20px 16px 45px}h1{font-size:24px;margin:0 0 16px}.panel{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #0001}label{display:block;font-weight:700;margin-bottom:8px}textarea{box-sizing:border-box;width:100%;min-height:130px;padding:12px;border:1px solid #ccd2d9;border-radius:10px;font-size:16px;resize:vertical}button{border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:700;background:#193f80;color:white;cursor:pointer}button:disabled{opacity:.5}.controls{display:flex;gap:10px;flex-wrap:wrap}#stop{background:#667085}.list-actions{display:flex;gap:10px;margin-top:10px}.list-actions button{flex:1;padding:12px 10px}#clearList{background:#b42318}#pasteList{background:#28644b}video{display:block;width:100%;aspect-ratio:16/9;height:auto;background:#111;border-radius:12px;object-fit:cover}#status{font-size:24px;font-weight:800;text-align:center;margin:12px 0 4px}#code{text-align:center;overflow-wrap:anywhere;font-size:17px;font-variant-numeric:tabular-nums}small{color:#475467}.counter{font-size:13px;color:#475467;margin-top:8px}</style></head><body><main><h1>バーコード照合</h1><section class="panel"><div class="controls"><button id="start">カメラを起動</button><button id="stop" disabled>停止</button></div><p><small>初回はカメラへのアクセスを許可してください。HTTPSで開く必要があります。</small></p><video id="video" autoplay muted playsinline></video><div id="status" role="status" aria-live="polite">読み取り待機中</div><div id="code"></div></section><section class="panel"><label for="list">照合リスト（1行に1コード）</label><textarea id="list" placeholder="4901234567894&#10;4987654321098"></textarea><div class="list-actions"><button type="button" id="pasteList">貼り付け</button><button type="button" id="clearList">全削除</button></div><div class="counter" id="count"></div></section><small>JANコード13桁専用。UPC-Aとして12桁で検出された場合は先頭に0を補って照合します。</small></main><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script><script>
const list=document.getElementById('list'),count=document.getElementById('count'),start=document.getElementById('start'),stop=document.getElementById('stop'),status=document.getElementById('status'),code=document.getElementById('code'),video=document.getElementById('video');
list.value=localStorage.getItem('barcode-list')||'';function matchingLine(value){const lines=list.value.split(/\r\n|\n|\r/);const index=lines.findIndex(line=>line.trim()===value);return index===-1?null:index+1}function update(){localStorage.setItem('barcode-list',list.value);count.textContent=list.value.split(/\r\n|\n|\r/).filter(x=>/^\d{13}$/.test(x.trim())).length+' 件登録（13桁）'}list.addEventListener('input',update);update();
document.getElementById('clearList').addEventListener('click',()=>{if(!list.value)return;if(window.confirm('照合リストをすべて削除しますか？')){list.value='';update();}});
document.getElementById('pasteList').addEventListener('click',async()=>{try{if(!navigator.clipboard?.readText)throw new Error('この環境ではクリップボードの読み取りが利用できません。');const pasted=await navigator.clipboard.readText();if(!pasted){window.alert('クリップボードにテキストがありません。');return;}list.value=pasted;update();}catch(e){window.alert('自動貼り付けができませんでした。テキストボックスを長押しして「ペースト」を選んでください。');list.focus();}});
let audio,controls=null,last='',lastAt=0,resetTimer=null;function beep(){if(!audio)return;const t=audio.currentTime+.02;[0,.17].forEach(d=>{let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=1250;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.18,t+d+.008);g.gain.setValueAtTime(.18,t+d+.075);g.gain.exponentialRampToValueAtTime(.001,t+d+.11);o.connect(g).connect(audio.destination);o.start(t+d);o.stop(t+d+.115)})}
function result(rawValue){
 const raw=String(rawValue).trim();
 const value=/^\d{12}$/.test(raw)?'0'+raw:raw;
 if(!/^\d{13}$/.test(value))return;
 const now=Date.now();
 // 同一コードの連続検出を1回のスキャンとして扱う。
 if(value===last&&now-lastAt<1800)return;
 last=value;lastAt=now;
 const line=matchingLine(value),matched=line!==null;
 document.body.classList.toggle('ok',matched);document.body.classList.toggle('ng',!matched);status.textContent=matched?'✓ 一致（'+line+'行目）':'✕ 不一致';code.textContent=value;if(matched)beep();clearTimeout(resetTimer);resetTimer=setTimeout(()=>{document.body.classList.remove('ok','ng');status.textContent='読み取り待機中'},1400)}
start.onclick=async()=>{start.disabled=true;status.textContent='カメラを起動しています…';try{audio??=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();if(!window.ZXingBrowser)throw new Error('読み取りライブラリを読み込めません。インターネット接続を確認してください。');const formats=window.ZXing?.BarcodeFormat;const hints=formats&&window.ZXing?.DecodeHintType?new Map([[ZXing.DecodeHintType.POSSIBLE_FORMATS,[formats.EAN_13,formats.UPC_A]]]):undefined;const reader=new ZXingBrowser.BrowserMultiFormatReader(hints);controls=await reader.decodeFromConstraints({audio:false,video:{facingMode:{ideal:'environment'}}},video,(res,err)=>{if(res)result(res.getText())});stop.disabled=false;status.textContent='読み取り待機中'}catch(e){status.textContent='起動できません: '+(e.message||e);start.disabled=false}};
stop.onclick=()=>{controls?.stop();controls=null;video.srcObject=null;start.disabled=false;stop.disabled=true;document.body.classList.remove('ok','ng');status.textContent='停止しました';clearTimeout(resetTimer)};
</script></body></html>
